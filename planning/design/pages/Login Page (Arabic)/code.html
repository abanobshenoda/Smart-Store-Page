<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px theme('colors.secondary'), 0 0 10px theme('colors.secondary-fixed');

        }
        .btn-gold-glow:hover {

        }

            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .bg-gradient-procedural {
            background: linear-gradient(135deg, #001e2f 0%, #18509F 50%, #79008b 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;

        @keyframes gradientMove {

            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }

</div>
</div>
<!-- Password -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-caps text-label-caps text-on-surface" for="password">كلمة المرور</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">هل نسيت كلمة المرور؟</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pr-10 pl-12 text-on-surface placeholder:text-outline focus:outline-none input-glow transition-all duration-300 font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>

<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary-container bg-surface-container-low cursor-pointer" id="remember" type="checkbox"/>
<label class="mr-2 font-body-md text-sm text-on-surface-variant cursor-pointer" for="remember">تذكرني</label>
</div>
<!-- Submit -->
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 rounded-full btn-gold-glow transition-all duration-300 relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">

</span>
