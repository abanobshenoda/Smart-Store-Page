<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-background relative overflow-hidden">
<!-- Abstract Ambient Background -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="absolute -bottom-40 -left-40 w-[30rem] h-[30rem] bg-secondary-fixed/20 rounded-full blur-3xl"></div>
</div>
<!-- Centered Card Layout -->
<main class="relative z-10 w-full max-w-md bg-surface-container-lowest rounded-full p-8 md:p-12 shadow-[0_8px_32px_rgba(115,92,0,0.05)] border border-outline-variant/30 flex flex-col items-center text-center transform transition-all hover:-translate-y-1 hover:shadow-[0_16px_48px_rgba(115,92,0,0.1)]">
<!-- Brand / Icon -->
<div class="mb-8 flex justify-center items-center w-16 h-16 rounded-full bg-surface-container-low border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="lock" data-weight="fill">lock</span>
</div>
<!-- Headings -->
<h1 class="font-headline-md text-headline-md text-primary mb-2">نسيت كلمة المرور؟</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-4">
            أدخل عنوان بريدك الإلكتروني أدناه وسنرسل لك رابطاً لإعادة تعيين كلمة المرور الخاصة بك.
        </p>
<!-- Form -->
<form action="#" class="w-full flex flex-col gap-6" method="POST">
<!-- Email Input -->
<div class="flex flex-col text-right">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-2 mr-1" for="email">البريد الإلكتروني</label>
<div class="relative group">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors z-10" data-icon="mail">mail</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg py-3 px-12 text-left font-body-md text-body-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm focus:shadow-[0_0_15px_rgba(212,175,55,0.2)]" dir="ltr" id="email" name="email" placeholder="example@domain.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 rounded-lg shadow-[0_4px_14px_rgba(212,175,55,0.2)] hover:shadow-gold-glow hover:bg-inverse-primary transform transition-all duration-300 flex justify-center items-center gap-2" type="submit">
                إرسال رابط إعادة التعيين
                <span class="material-symbols-outlined text-sm rotate-180" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-8 pt-6 border-t border-outline-variant/20 w-full text-center">
<a class="inline-flex items-center gap-1 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                العودة إلى تسجيل الدخول
            </a>
</div>
</main>
<script>
        // Apply styling for Material Symbols
        document.querySelectorAll('[data-weight="fill"]').forEach(el => {
            el.style.fontVariationSettings = "'FILL' 1";
        });
    </script>
</body></html>
