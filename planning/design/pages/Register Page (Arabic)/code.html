<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Store - إنشاء حساب جديد</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#554300",
                        "surface-variant": "#e5e2e1",
                        "background": "#fcf9f8",
                        "on-tertiary-fixed-variant": "#7c008e",
                        "on-surface-variant": "#4d4635",
                        "on-primary-fixed-variant": "#574500",
                        "surface-container": "#f0eded",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#d4af37",
                        "secondary": "#006591",
                        "inverse-primary": "#e9c349",
                        "on-secondary-fixed": "#001e2f",
                        "surface-tint": "#735c00",
                        "secondary-fixed": "#c9e6ff",
                        "tertiary-fixed-dim": "#fbabff",
                        "surface": "#fcf9f8",
                        "on-secondary-fixed-variant": "#004c6e",
                        "on-background": "#1c1b1b",
                        "primary-fixed-dim": "#e9c349",
                        "on-secondary-container": "#004666",
                        "inverse-on-surface": "#f3f0ef",
                        "on-tertiary-container": "#79008b",
                        "surface-container-highest": "#e5e2e1",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffd6fd",
                        "tertiary-container": "#f58bff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "surface-container-low": "#f6f3f2",
                        "inverse-surface": "#313030",
                        "outline-variant": "#d0c5af",
                        "on-error-container": "#93000a",
                        "primary": "#735c00",
                        "on-tertiary-fixed": "#36003e",
                        "surface-white": "#FFFFFF",
                        "on-surface": "#1c1b1b",
                        "secondary-fixed-dim": "#89ceff",
                        "surface-container-high": "#eae7e7",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#241a00",
                        "gold-glow": "rgba(212, 175, 55, 0.4)",
                        "secondary-container": "#39b8fd",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffe088",
                        "royal-blue": "#18509F",
                        "surface-dim": "#dcd9d9",
                        "on-secondary": "#ffffff",
                        "outline": "#7f7663",
                        "error-container": "#ffdad6",
                        "tertiary": "#a200ba"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-desktop": "64px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg-mobile": ["Bodoni Moda"],
                        "headline-md": ["Bodoni Moda"],
                        "headline-sm": ["Bodoni Moda"],
                        "display-lg": ["Bodoni Moda"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .premium-input {
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            box-shadow: 0 0 0 2px theme('colors.primary-container'), 0 0 15px rgba(212, 175, 55, 0.2);
            border-color: transparent;
        }
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #fcf9f8, #f0eded, #e9c349, #dcd9d9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .floating-shoe {
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.15));
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<main class="flex-grow flex items-center justify-center p-4 md:p-margin-desktop">
<div class="w-full max-w-container-max mx-auto bg-surface-container-lowest rounded-xl overflow-hidden shadow-2xl flex flex-col lg:flex-row min-h-[800px] border border-surface-variant">
<!-- Right Column (Form) -->
<div class="w-full lg:w-1/2 p-8 md:p-12 lg:p-16 flex flex-col justify-center bg-surface-white relative z-10">
<div class="mb-10 text-center lg:text-right">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Smart Store</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">إنشاء حساب جديد</h2>
<p class="font-body-md text-on-surface-variant mt-2">انضم إلينا واكتشف عالم الأناقة والفخامة.</p>
</div>
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="firstName">الاسم الأول</label>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none" id="firstName" placeholder="أحمد" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="lastName">اسم العائلة</label>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none" id="lastName" placeholder="محمود" type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="email">البريد الإلكتروني</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-lg pr-10 pl-4 py-3 text-on-surface focus:outline-none text-left dir-ltr" dir="ltr" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="mobile">رقم الجوال</label>
<div class="flex">
<span class="inline-flex items-center px-4 rounded-r-lg border border-l-0 border-outline-variant bg-surface-container text-on-surface-variant font-body-md" dir="ltr">
                                +20
                            </span>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-l-lg px-4 py-3 text-on-surface focus:outline-none text-left dir-ltr" dir="ltr" id="mobile" placeholder="10x xxx xxxx" type="tel"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="password">كلمة المرور</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant cursor-pointer" onclick="togglePassword('password')">
<span class="material-symbols-outlined" id="password-icon">visibility_off</span>
</span>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-lg pr-10 pl-4 py-3 text-on-surface focus:outline-none text-left dir-ltr" dir="ltr" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Password Strength Indicator -->
<div class="mt-2 flex space-x-1 space-x-reverse h-1.5 rounded-full overflow-hidden bg-surface-container">
<div class="w-1/3 bg-error transition-all duration-300"></div>
<div class="w-1/3 bg-primary-container opacity-20 transition-all duration-300"></div>
<div class="w-1/3 bg-secondary opacity-20 transition-all duration-300"></div>
</div>
<p class="text-xs text-on-surface-variant mt-1 text-left" dir="ltr">Weak</p>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="confirmPassword">تأكيد كلمة المرور</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant cursor-pointer" onclick="togglePassword('confirmPassword')">
<span class="material-symbols-outlined" id="confirmPassword-icon">visibility_off</span>
</span>
<input class="premium-input w-full bg-surface-container-low border border-outline-variant rounded-lg pr-10 pl-4 py-3 text-on-surface focus:outline-none text-left dir-ltr" dir="ltr" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant rounded focus:ring-primary focus:ring-2" id="terms" type="checkbox"/>
</div>
<label class="mr-2 text-sm font-body-md text-on-surface-variant" for="terms">
                            أوافق على <a class="text-primary hover:underline font-bold" href="#">الشروط والأحكام</a> و <a class="text-primary hover:underline font-bold" href="#">سياسة الخصوصية</a>.
                        </label>
</div>
<button class="w-full bg-primary-container text-on-primary-container hover:bg-inverse-primary hover:shadow-[0_0_20px_rgba(212,175,55,0.4)] transition-all duration-300 rounded-full py-4 font-headline-sm text-headline-sm flex justify-center items-center gap-2 mt-4" type="submit">
<span>إنشاء الحساب</span>
<span class="material-symbols-outlined">arrow_left_alt</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-body-md text-on-surface-variant mb-4">أو سجل باستخدام</p>
<div class="flex justify-center gap-4">
<button class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">mail</span>
</button>
<button class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">language</span>
</button>
</div>
<p class="mt-6 font-body-md text-on-surface-variant">
                        لديك حساب بالفعل؟ <a class="text-primary hover:underline font-bold" href="#">تسجيل الدخول</a>
</p>
</div>
</div>
<!-- Left Column (Visual) -->
<div class="hidden lg:flex w-1/2 animated-gradient-bg relative overflow-hidden items-center justify-center p-12">
<!-- Decorative Elements -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 20% 30%, theme('colors.primary-container') 0%, transparent 40%), radial-gradient(circle at 80% 70%, theme('colors.secondary') 0%, transparent 40%);"></div>
<div class="glass-panel p-8 rounded-2xl w-full max-w-md flex flex-col items-center text-center relative z-10 shadow-2xl">
<img alt="Premium Luxury Sneaker" class="w-full object-contain mb-8 floating-shoe h-64 drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UlZK1CAcahy5sICGlfFklkyaEBJ2KuSirVnZKgFhXk1H_InlK4DecOUQb_n3MCtliNR7BbwXOKtxWi2XK58Q8LvwM0asvdFGS5W-H2sNWt83mnaT9sMg9JzGEqUQ5IX9lvYnxTUPt_LBqmiikbXShgK5Hj6LKfXzcZYAC41N68BrAFpSiVfXr6wK3B0itsYirCY1i7h9EFHgY-BhVPomPTCAvwvU8Samd6aBF0MvjUzgF5deJryYdn4xsG"/>
<h3 class="font-headline-md text-headline-md text-on-surface mb-4">اكتشف التميز</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant">حيث تلتقي العراقة مع أحدث صيحات الموضة. انضم الآن للوصول الحصري لأحدث التشكيلات.</p>
</div>
</div>
</div>
</main>
<script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
